# The checks that must pass before code is merged or released.
#
# Called by pr.yml for pull requests and by release.yml before it publishes a
# tag. Keeping them in one place means a check added here cannot be added to
# one path and forgotten on the other - and the release path is the one where
# a gap is unrecoverable, since a tag on proxy.golang.org cannot be withdrawn.
name: Verify

on:
  workflow_call:
    inputs:
      coverage:
        description: Print the coverage report. Useful on a pull request, noise during a release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Firestore cannot run in CI, so the live tests run against MongoDB. A
      # single-node replica set is the smallest deployment with transactions.
      - name: Start MongoDB
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 30); do
            if docker exec mongo mongosh --quiet --eval \
              'try { rs.status() } catch (e) { rs.initiate() }; db.hello().isWritablePrimary' 2>/dev/null |
              grep -qx true; then
              exit 0
            fi
            sleep 2
          done
          docker logs mongo
          echo "::error::MongoDB did not become primary"
          exit 1

      - name: Test
        env:
          MGX_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          MGX_TEST_TXN: "1"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        if: inputs.coverage
        run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` lets a linter release turn an unrelated PR red.
          version: v2.13.2

      - name: Shellcheck release scripts
        run: shellcheck .github/scripts/*.sh

      - name: Test release versioning
        run: .github/scripts/next-version_test.sh
